<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Story Submitted - Poverty Aid Identifier</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:Arial,sans-serif; background:#f5f5f5; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
        .card { background:white; border-radius:20px; padding:40px 30px; text-align:center; max-width:420px; width:100%; box-shadow:0 8px 30px rgba(0,0,0,0.1); }
        .icon { font-size:60px; margin-bottom:16px; }
        h1 { color:#138808; font-size:22px; margin-bottom:10px; }
        p { color:#555; font-size:14px; line-height:1.6; margin-bottom:8px; }
        .note { background:#f8f9ff; border-radius:10px; padding:14px; margin:20px 0; font-size:13px; color:#666; }
        .btn { display:block; padding:14px; background:#000080; color:white; border-radius:10px; text-decoration:none; font-weight:bold; font-size:15px; margin-top:10px; }
        .btn.green { background:#138808; }
    </style>
</head>
<body>
<div class="card">
    <div class="icon">🙏</div>
    <h1>Thank You!</h1>
    <p>Your story has been submitted successfully.</p>
    <p>It will appear on the Success Stories page after review — usually within 24 hours.</p>
    <div class="note">
        Your story will inspire other families to claim what is rightfully theirs. 🇮🇳
    </div>
    <a href="/stories" class="btn green">View Stories</a>
    <a href="/" class="btn" style="margin-top:8px;">Back to Main App</a>
</div>
</body>
</html>
