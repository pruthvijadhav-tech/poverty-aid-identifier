<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Too Many Requests - Poverty Aid Identifier</title>
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#000080">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #000080; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .box { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); border-radius: 20px; padding: 40px 30px; text-align: center; max-width: 400px; width: 100%; border: 1px solid rgba(255,255,255,0.2); }
        .error-code { font-size: 80px; font-weight: bold; color: #FF9933; line-height: 1; margin-bottom: 10px; }
        h2 { color: white; font-size: 22px; margin-bottom: 15px; }
        p { color: rgba(255,255,255,0.8); font-size: 14px; line-height: 1.6; margin-bottom: 25px; }
        .btn { display: block; padding: 14px 25px; background: #FF9933; color: white; border-radius: 10px; text-decoration: none; font-weight: bold; font-size: 15px; }
        .countdown { font-size: 40px; font-weight: bold; color: #FF9933; margin: 15px 0; }
        .tricolor { height: 5px; background: linear-gradient(90deg, #FF9933 33%, white 33%, white 66%, #138808 66%); border-radius: 3px; margin-bottom: 25px; }
    </style>
</head>
<body>
    <div class="box">
        <div class="tricolor"></div>
        <div class="error-code">429</div>
        <h2>Too Many Requests</h2>
        <p>You have submitted too many requests. Please wait before trying again.</p>
        <p style="font-size:12px;">बहुत अधिक अनुरोध। / खूप जास्त विनंत्या.</p>
        <div class="countdown" id="countdown">60</div>
        <p style="font-size:12px; color:rgba(255,255,255,0.6);">seconds remaining</p>
        <a href="/" class="btn" id="homeBtn" style="margin-top:20px; opacity:0.5; pointer-events:none;">Please Wait...</a>
    </div>
    <script>
        let seconds = 60;
        const countdown = document.getElementById('countdown');
        const btn = document.getElementById('homeBtn');
        const timer = setInterval(() => {
            seconds--;
            countdown.innerText = seconds;
            if (seconds <= 0) {
                clearInterval(timer);
                countdown.innerText = '✓';
                btn.innerText = 'Go to Home';
                btn.style.opacity = '1';
                btn.style.pointerEvents = 'auto';
            }
        }, 1000);
    </script>
</body>
</html>
