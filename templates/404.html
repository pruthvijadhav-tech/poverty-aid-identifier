<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Poverty Aid Identifier</title>
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#000080">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #000080; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .box { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); border-radius: 20px; padding: 40px 30px; text-align: center; max-width: 400px; width: 100%; border: 1px solid rgba(255,255,255,0.2); }
        .error-code { font-size: 80px; font-weight: bold; color: #FF9933; line-height: 1; margin-bottom: 10px; }
        h2 { color: white; font-size: 22px; margin-bottom: 15px; }
        p { color: rgba(255,255,255,0.8); font-size: 14px; line-height: 1.6; margin-bottom: 25px; }
        .btn { display: block; padding: 14px 25px; background: #FF9933; color: white; border-radius: 10px; text-decoration: none; font-weight: bold; font-size: 15px; margin-bottom: 10px; }
        .btn-outline { display: block; padding: 14px 25px; background: transparent; color: white; border: 2px solid rgba(255,255,255,0.3); border-radius: 10px; text-decoration: none; font-size: 15px; }
        .tricolor { height: 5px; background: linear-gradient(90deg, #FF9933 33%, white 33%, white 66%, #138808 66%); border-radius: 3px; margin-bottom: 25px; }
    </style>
</head>
<body>
    <div class="box">
        <div class="tricolor"></div>
        <div class="error-code">404</div>
        <h2>Page Not Found</h2>
        <p>The page you are looking for does not exist or has been moved.</p>
        <p style="font-size:12px;">यह पृष्ठ नहीं मिला। / हे पृष्ठ सापडले नाही.</p>
        <a href="/" class="btn">Go to Home / होम पर जाएं</a>
        <a href="/track" class="btn-outline">Track Complaint</a>
    </div>
</body>
</html>
